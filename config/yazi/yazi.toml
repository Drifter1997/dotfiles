[opener]
edit = [
	{ run = 'nvim %s', block = true, desc = "Neovim" },
]
execute = [
	{ run = 'bash %s', block = true, desc = "Run script" },
]

[open]
prepend_rules = [
	{ url = "*.sh", use = [ "edit", "execute", "reveal" ] },
	{ url = "*.bash", use = [ "edit", "execute", "reveal" ] },
	{ url = "*.zsh", use = [ "edit", "execute", "reveal" ] },
	{ url = "*.fish", use = [ "edit", "execute", "reveal" ] },
	{ url = "*.py", use = [ "edit", "reveal" ] },
	{ url = "*.lua", use = [ "edit", "reveal" ] },
	{ url = "*.json", use = "edit" },
	{ url = "*.toml", use = "edit" },
	{ url = "*.yaml", use = "edit" },
	{ url = "*.yml", use = "edit" },
	{ mime = "text/*", use = "edit" },
	{ mime = "application/{x-shellscript,x-sh,json,javascript,xml,toml}", use = "edit" },
]
